<div class="card position-relative user-card">
  <button (click)="deleteUser(user.id, $event)" class="delete-btn btn btn-warning btn-sm">
    X
  </button>

  <div class="card-body d-flex align-items-center">
    <div class="user-avatar me-3">{{ initials }}</div>
    <div class="user-title">
      <h5 class="m-0">{{ user.firstName }} {{ user.lastName }}</h5>
      <div class="text-muted small">{{ user.email }}</div>
    </div>
  </div>
</div>
