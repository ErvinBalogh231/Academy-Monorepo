<div class="d-flex justify-content-center pt-5">
    <div class="card p-4 login-card">
        <h3 class="mb-3">Login</h3>
        <form (ngSubmit)="login()">
            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input [(ngModel)]="email" class="form-control" id="email" name="email" type="email" autocomplete="username">
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input [(ngModel)]="password" class="form-control" id="password" name="password" type="password" autocomplete="current-password">
            </div>

            @if (errorMessage) {
                <div class="alert alert-danger py-2">{{ errorMessage }}</div>
            }

            <div class="d-flex justify-content-between align-items-center">
                <button [disabled]="!email || !password || loading" class="btn btn-primary" type="submit">
                    Login
                </button>
                <a routerLink="/register">Register</a>
            </div>
        </form>
    </div>
</div>
